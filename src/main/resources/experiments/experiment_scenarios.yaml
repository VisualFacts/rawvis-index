  synth10_1B:
    csv: /home/smaroulis/data/synth10_1B.csv
    hasHeader: false
    delimiter: ','
    xColumn: 0
    yColumn: 1
    measureCols: [2,3,4,5,6,7,8,9]
    bounds: "0:1000,0:1000"
    objectCount: 1000000000
    validationFilters: []
  taxi:
    csv: /home/smaroulis/data/yellow_tripdata_2013_2014_cleaned.csv
    hasHeader: true
    delimiter: ','
    xColumn: 5
    yColumn: 6
    # Columns: 0=vendor, 1=pickup_time, 2=dropoff_time, 3=passenger_count, 4=trip_distance,
    #          5=pickup_lon, 6=pickup_lat, 7=rate_code, 8=store_fwd, 9=dropoff_lon, 10=dropoff_lat,
    #          11=payment_type, 12=fare_amount, 13=surcharge, 14=mta_tax, 15=tip_amount, 16=tolls, 17=total_amount
    # Measure analysis (1M sample): 
    #   fare_amount(12):  CV=0.82, 0% zeros, min=$2.50
    #   total_amount(17): CV=0.82, 0% zeros, min=$3.00
    #   trip_distance(4): CV=1.20, 0.8% zeros
    #   passenger_count(3): CV=0.49, discrete 1-9
    #   tip_amount(15):   CV=1.83, 57% zeros (cash not recorded)
    #   tolls_amount(16): CV=5.50, 97% zeros
    # Data: merged 2013+2014, pre-cleaned (zero coords, invalid geo, total_amount<=0 or >500 removed)
    measureCols: [12, 17, 4, 3]
    bounds: "-74.106216:-73.842545,40.676993:40.839788"
    objectCount: 331713605
    validationFilters: []
  gaia_dr3:
    csv: /data/smaroulis/gaia_dr3_benchmark_shuffled.csv
    hasHeader: false
    delimiter: ','
    xColumn: 0    # ra (Right Ascension, degrees)
    yColumn: 1    # dec (Declination, degrees)
    # Columns (0-indexed):
    #   0=ra, 1=dec, 2=phot_g_mean_mag, 3=phot_bp_mean_mag, 4=phot_rp_mean_mag,
    #   5=parallax, 6=pmra, 7=pmdec, 8=ruwe,
    #   9=phot_g_mean_flux, 10=phot_g_mean_flux_error,
    #   11=phot_bp_mean_flux, 12=phot_rp_mean_flux, 13=astrometric_excess_noise
    # Measure column ordering: scientifically meaningful, no flux/mag redundancy.
    # Distance-led: parallax first (high CV, most impactful Gaia measurement).
    # 1-col:  parallax (distance — "how far are the stars?")
    # 4-col:  + phot_g_mean_mag, pmra, pmdec (brightness + 6D phase space lite)
    # 8-col:  + phot_bp_mean_mag, phot_rp_mean_mag, ruwe, astrometric_excess_noise
    measureCols: [5, 2, 6, 7, 3, 4, 8, 13]
    bounds: "0:360,-90:90"
    objectCount: 328022175
    validationFilters: []
  ebird_us:
    csv: /data/smaroulis/ebd_US_2023_2026.txt
    hasHeader: true
    delimiter: '\t'
    xColumn: 29    # LONGITUDE
    yColumn: 28    # LATITUDE
    # Columns (0-indexed): standard eBird Basic Dataset layout
    #   10=OBSERVATION COUNT, 28=LATITUDE, 29=LONGITUDE,
    #   40=DURATION MINUTES, 41=EFFORT DISTANCE KM, 43=NUMBER OBSERVERS
    # Measure ordering by increasing CV (2023-2026 filtered, excludes 'X'):
    #   DURATION(40): CV=1.03, 4.6% null, avg=89.9, median=63
    #   DISTANCE(41): CV=1.66, 25.8% null, avg=3.13, median=1.65
    #   NUM_OBSERVERS(43): CV=4.22, 0.25% null, avg=2.52, median=1
    #   OBS_COUNT(10): CV=134.1, 2.0% "X"→NaN, avg=13.6, median=2
    # Data: eBird US, Feb 2026 release, filtered to 2023-01-01..2026-02-28
    #   ~420M rows, ~155 GB TSV, not sorted
    #   Filtered to CONUS only (no Alaska, Hawaii, or territories)
    #   Lat [24.03, 49.36], Lon [-125.96, -66.24]
    measureCols: [40, 41, 43, 10]
    nullstr: 'X'
    bounds: "-125.96:-66.24,24.03:49.36"
    objectCount: 420300000
    validationFilters:
      - "40>1440.0"    # Remove checklists > 24 hours (DURATION MINUTES)
      - "43<1.0"       # Remove records with negative observers (NUMBER OBSERVERS)
scenarios:
  # ── synth10: clustered (Gaussian Mixture Foci, K=1) workload ──────────────
  #
  # All scenarios share:
  #   - focus centred at the dataset midpoint (500, 500)
  #   - focusSpreadFraction = 0.05 (σ = 50 per axis = 5% of the 1000-unit extent)
  #   - extentMode = closedForm (synth data is uniform, so calibrated == closed-form)
  #   - seqCount = 100 (matches the uniform-random + clustered budgets)
  # Selectivity axis: fix dataset at 300M rows, vary query rect size.
  # Scalability axis: fix selectivity at 1%, vary dataset size.

  # --- Selectivity axis (300M rows) ---
  synth10_300M_clustered_sel001:
    dataset: synth10_300M
    workload:
      type: clustered
      seqCount: 500
      selectivity: 0.0001        # 0.01%
      extentMode: closedForm
      seed: 0
      numFoci: 1
      focusSpreadFraction: 0.05
      focusCenters: ["500,500"]
  synth10_300M_clustered_sel01:
    dataset: synth10_300M
    workload:
      type: clustered
      seqCount: 500
      selectivity: 0.001         # 0.1%
      extentMode: closedForm
      seed: 0
      numFoci: 1
      focusSpreadFraction: 0.05
      focusCenters: ["500,500"]
  synth10_300M_clustered_sel1:
    dataset: synth10_300M
    workload:
      type: clustered
      seqCount: 500
      selectivity: 0.01          # 1% (default synth10 cell)
      extentMode: closedForm
      seed: 0
      numFoci: 1
      focusSpreadFraction: 0.05
      focusCenters: ["500,500"]
  synth10_300M_clustered_sel5:
    dataset: synth10_300M
    workload:
      type: clustered
      seqCount: 500
      selectivity: 0.05          # 5%
      extentMode: closedForm
      seed: 0
      numFoci: 1
      focusSpreadFraction: 0.05
      focusCenters: ["500,500"]
  synth10_300M_clustered_sel10:
    dataset: synth10_300M
    workload:
      type: clustered
      seqCount: 500
      selectivity: 0.10          # 10%
      extentMode: closedForm
      seed: 0
      numFoci: 1
      focusSpreadFraction: 0.05
      focusCenters: ["500,500"]

  # --- Scalability axis (1% selectivity, vary dataset size) ---
  synth10_50M_clustered_sel1:
    dataset: synth10_50M
    workload:
      type: clustered
      seqCount: 500
      selectivity: 0.01
      extentMode: closedForm
      seed: 0
      numFoci: 1
      focusSpreadFraction: 0.05
      focusCenters: ["500,500"]
  synth10_100M_clustered_sel1:
    dataset: synth10_100M
    workload:
      type: clustered
      seqCount: 500
      selectivity: 0.01
      extentMode: closedForm
      seed: 0
      numFoci: 1
      focusSpreadFraction: 0.05
      focusCenters: ["500,500"]
  synth10_500M_clustered_sel1:
    dataset: synth10_500M
    workload:
      type: clustered
      seqCount: 500
      selectivity: 0.01
      extentMode: closedForm
      seed: 0
      numFoci: 1
      focusSpreadFraction: 0.05
      focusCenters: ["500,500"]
  synth10_1B_clustered_sel1:
    dataset: synth10_1B
    workload:
      type: clustered
      seqCount: 500
      selectivity: 0.01
      extentMode: closedForm
      seed: 0
      numFoci: 1
      focusSpreadFraction: 0.05
      focusCenters: ["500,500"]

  # ── Real-dataset clustered (Gaussian Mixture Foci, K=1) workloads ──────────
  # Same generator as the synth10 clustered cells, but centred on each
  # dataset's well-known density hotspot (matching the exploratory zoom-in
  # target). focusSpreadFraction=0.05 of dataset extent gives a tight focus
  # well inside the bbox; selectivity=0.01 (1%) and seqCount=100 align with
  # the random and exploratory budgets for a clean A/B/C comparison.
  # extentMode=calibrated uses the spatial reservoir to compensate for non-
  # uniform data density when sizing the (sx, sy) extent.
  taxi_clustered:
    dataset: taxi
    workload:
      type: clustered
      seqCount: 500
      selectivity: 0.01
      extentMode: calibrated
      seed: 0
      numFoci: 1
      focusSpreadFraction: 0.05
      focusCenters: ["-73.985,40.758"]    # Times Square

  gaia_dr3_clustered:
    dataset: gaia_dr3
    workload:
      type: clustered
      seqCount: 500
      selectivity: 0.01
      extentMode: calibrated
      seed: 0
      numFoci: 1
      focusSpreadFraction: 0.05
      focusCenters: ["266.4,-29.0"]       # Galactic Centre (Sgr A*)

  ebird_us_clustered:
    dataset: ebird_us
    workload:
      type: clustered
      seqCount: 500
      selectivity: 0.01
      extentMode: calibrated
      seed: 0
      numFoci: 1
      focusSpreadFraction: 0.05
      focusCenters: ["-74.95,38.95"]      # Cape May, NJ

  # Gaia DR3 spatial benchmark (10% sample, 328M rows, 14 columns).

  # Scenario: astronomer surveys the Galactic plane starting from the GC (RA≈266°, Dec≈-29°),
  # scanning outward (NE in equatorial coords) to study stellar populations and dust structure.
  # Viewport: 10° x 6° (~0.093% of full-sky area, ~4-5M stars per query).
  # Directional bias ~3:1 (NE along plane vs W/S opposite).
  gaia_dr3_pan:
    dataset: gaia_dr3
    q0:
      rect: "261:271,-32:-26"
    minShift: 5
    maxShift: 12
    zoomFactor: 0
    seqCount: 100
    directionWeights:
      N: 1.0
      NE: 2.0
      E: 1.5
      SE: 0.8
      S: 0.5
      SW: 0.7
      W: 0.5
      NW: 0.8
  # ── Exploratory scenarios (per-dataset narratives) ─────────────────────
  # Each dataset gets the exploration pattern that fits its scale and
  # natural use case. All scenarios use a fixed 10% shift per pan (a
  # "meaningful viewport drag") and total exactly 100 queries.
  # No clampToBounds: trajectories are designed (via q0 size + position +
  # direction bias) to stay well inside the dataset bbox without any clamp.

  # Taxi (NYC Yellow Cab pickups, Manhattan): 5-phase zoom narrative.
  # An analyst opens the Manhattan overview, briefly orients, zooms 4x onto
  # Times Square (-73.985, 40.758), explores Midtown block-by-block along
  # the avenue grid (E-W bias), then zooms back out for a warm-index sweep.
  # q0: 0.13 x 0.10 deg (Financial District to Harlem).
  # investigate viewport after 4x zoom: ~0.033 x 0.025 deg (~3 city blocks).
  # Symmetric direction weights (E:W and N:S balanced) keep the random walk
  # centred on Times Square; the orient/re_overview phases use a soft safety
  # clamp set to the Manhattan bbox so the wide viewport never crosses into
  # the Hudson/East River.
  taxi_exploratory:
    dataset: taxi
    q0:
      rect: "-74.03:-73.90,40.71:40.81"
    phases:
      - name: orient
        operation: pan
        count: 5
        minShift: 10
        maxShift: 10
        directionWeights: { N: 1, NE: 1, E: 1, SE: 1, S: 1, SW: 1, W: 1, NW: 1 }
        # Soft safety rail at the dataset bbox: viewport stays inside Manhattan.
        clampToBounds: "-74.106216:-73.842545,40.676993:40.839788"
      - name: zoom_into_hotspot
        operation: zoom_to_point
        target: "-73.985,40.758"
        zoomFactor: 0.5
        count: 2
      - name: investigate
        operation: pan
        count: 55
        minShift: 10
        maxShift: 10
        # E-W bias along the avenue grid; N:S balanced; no net drift
        directionWeights: { N: 0.5, NE: 0.5, E: 3, SE: 0.5, S: 0.5, SW: 0.5, W: 3, NW: 0.5 }
      - name: zoom_out
        operation: zoom_out
        zoomFactor: 2.0
        count: 2
      - name: re_overview
        operation: pan
        count: 35
        minShift: 10
        maxShift: 10
        directionWeights: { N: 1, NE: 1, E: 1, SE: 1, S: 1, SW: 1, W: 1, NW: 1 }
        clampToBounds: "-74.106216:-73.842545,40.676993:40.839788"

  # Gaia DR3 (10% sample, 328M stars): directional-pan narrative.
  # An astronomer surveys the Galactic plane starting from a 10 x 6 deg
  # window centred on Sagittarius/Scorpius near the Galactic Centre
  # (RA 266, Dec -29), scanning outward along the plane (NE bias) over 99
  # pans to study stellar populations and dust structure across the bulge
  # and inner disk. With 100 fixed-10% pans and a moderate NE bias the
  # final viewport sits well inside the all-sky bbox (0..360, -90..90).
  gaia_dr3_exploratory:
    dataset: gaia_dr3
    q0:
      rect: "261:271,-32:-26"
    seqCount: 100
    minShift: 10
    maxShift: 10
    zoomFactor: 0
    directionWeights:
      N:  1.0
      NE: 2.0
      E:  1.5
      SE: 0.8
      S:  0.5
      SW: 0.7
      W:  0.5
      NW: 0.8

  # eBird US (2023-2026, 420M checklists): directional-pan narrative.
  # An ornithologist follows spring migration from the Rio Grande Valley
  # in South Texas (the #1 US spring birding hotspot, where neotropical
  # migrants make landfall after crossing the Gulf) up the Central /
  # Mississippi flyway to the Mid-Atlantic. q0 is a 3 x 2 deg window
  # centred on the RGV; 99 fixed-10% pans with a strong NE bias scan the
  # flyway, ending near the Chesapeake / Mid-Atlantic coast. Trajectory
  # stays inside CONUS (lon -125.96..-66.24, lat 24.03..49.36).
  ebird_us_exploratory:
    dataset: ebird_us
    q0:
      rect: "-98.5:-95.5,26:28"
    seqCount: 100
    minShift: 10
    maxShift: 10
    zoomFactor: 0
    directionWeights:
      N:  1.5
      NE: 3.0
      E:  2.0
      SE: 0.3
      S:  0.2
      SW: 0.1
      W:  0.2
      NW: 0.3

  # ── Non-exploration workloads (random) ─────────────────────────────────────
  # --- Uniform random ------------------------------------
  # Centres are sampled from a per-dataset spatial reservoir (single seeded
  # CSV pass, cached under experiments/query_sequences/reservoirs/), so the
  # query distribution follows the data distribution. The fixed (sx, sy) is
  # calibrated so that the AVERAGE per-query selectivity equals `selectivity`.
  # Per-query selectivity varies with local data
  # density on real datasets; on the uniform synthetic dataset the closedForm
  # mode collapses to plain uniform-domain queries with constant selectivity.
  # Boundary policy: rectangles that overflow the bounding box are shifted
  # inward (area preserved → mean selectivity preserved exactly).
  gaia_dr3_random:
    dataset: gaia_dr3
    workload:
      type: random
      seqCount: 500
      selectivity: 0.01
      seed: 0

  ebird_us_random:
    dataset: ebird_us
    workload:
      type: random
      seqCount: 500
      selectivity: 0.01
      seed: 0

  taxi_random:
    dataset: taxi
    workload:
      type: random
      seqCount: 500
      selectivity: 0.01
      seed: 0

  synth10_300M_random_sel1:
    dataset: synth10_300M
    workload:
      type: random
      # 500 queries: matches synth10_300M_clustered_sel1 so the random and
      # clustered adaptation curves are directly comparable. Baselines are
      # typically capped via MAX_QUERIES_DUCKDB / MAX_QUERIES_PILOTDB.
      seqCount: 500
      selectivity: 0.01
      extentMode: closedForm   # synthetic data is uniform: skip the reservoir build
      seed: 0
