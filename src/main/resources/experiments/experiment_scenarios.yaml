      filters: {}
    minShift: 10
    maxShift: 20
    zoomFactor: 0
    seqCount: 100
    directionWeights:
      N: 1.0
      NE: 0.5
      E: 0.5
      SE: 0.5
      S: 0.5
      SW: 0.5
      W: 1.0
      NW: 1.0
  taxi_pan:
    dataset: taxi
    q0:
      rect: "-73.99831454:-73.97500902,40.7151612032:40.73263959"
      filters: {}
    minShift: 10
    maxShift: 10
    zoomFactor: 0
    seqCount: 100
    directionWeights:
      N: 1.0
      NE: 0.5
      E: 0.5
      SE: 0.5
      S: 0.5
      SW: 0.5
      W: 1.0
      NW: 1.0

  # Queries pan along Right Ascension within the primary SDSS imaging stripe (Dec ≈ -3° to 0°), where photometric data density is highest.
  sdss_100cols_pan:
    dataset: sdss_100cols
    q0:
      rect: "180:190,-3:0"
      filters: {}
    minShift: 5
    maxShift: 12
    zoomFactor: 0
    seqCount: 100
    directionWeights:
      N: 0.2
      NE: 0.8
      E: 3.0
      SE: 0.8
      S: 0.2
      SW: 0.3
      W: 1.0
      NW: 0.3