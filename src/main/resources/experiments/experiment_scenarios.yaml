  synth10_500M_pan_sel1:
    dataset: synth10_500M
    q0:
      rect: "650:750,120:220"   # 1% sel, side=100
      filters: {}
    minShift: 10
    maxShift: 10
    zoomFactor: 0
    seqCount: 100
    directionWeights:
      N: 1.0
      NE: 0.5
      E: 0.5
      SE: 0.5
      S: 0.5
      SW: 0.5
      W: 1.0
      NW: 1.0

  taxi_pan:
    dataset: taxi
    q0:
      rect: "-73.99831454:-73.97500902,40.7151612032:40.73263959"
      filters: {}
    minShift: 10
    maxShift: 10
    zoomFactor: 0
    seqCount: 100
    directionWeights:
      N: 1.0
      NE: 0.5
      E: 0.5
      SE: 0.5
      S: 0.5
      SW: 0.5
      W: 1.0
      NW: 1.0

  # Queries pan along Right Ascension within the primary SDSS imaging stripe (Dec ≈ -3° to 0°), where photometric data density is highest.
  sdss_100cols_pan:
    dataset: sdss_100cols
    q0:
      rect: "180:190,-3:0"
      filters: {}
    minShift: 5
    maxShift: 12
    zoomFactor: 0
    seqCount: 100
    directionWeights:
      N: 0.2
      NE: 0.8
      E: 3.0
      SE: 0.8
      S: 0.2
      SW: 0.3
      W: 1.0
      NW: 0.3

  sdss_10cols_pan:
    dataset: sdss_10cols
    q0:
      rect: "180:190,-3:0"
      filters: {}
    minShift: 5
    maxShift: 12
    zoomFactor: 0
    seqCount: 100
    directionWeights:
      N: 0.2
      NE: 0.8
      E: 3.0
      SE: 0.8
      S: 0.2
      SW: 0.3
      W: 1.0
      NW: 0.3

  # Gaia DR3 spatial benchmark (10% sample, 328M rows, 14 columns).
  # Scenario: astronomer surveys the Galactic plane starting from the GC (RA≈266°, Dec≈-29°),
  # scanning outward (NE in equatorial coords) to study stellar populations and dust structure.
  # Viewport: 10° x 6° (~0.093% of full-sky area, ~4-5M stars per query).
  # Directional bias ~3:1 (NE along plane vs W/S opposite).
  gaia_dr3_pan:
    dataset: gaia_dr3
    q0:
      rect: "261:271,-32:-26"
      filters: {}
    minShift: 5
    maxShift: 12
    zoomFactor: 0
    seqCount: 100
    directionWeights:
      N: 1.0
      NE: 2.0
      E: 1.5
      SE: 0.8
      S: 0.5
      SW: 0.7
      W: 0.5
      NW: 0.8

  # Gaia DR3 shuffled — same query pattern on the randomly shuffled CSV.
  # Used to evaluate DuckDB without zone-map advantage from RA-sorted ordering.
  gaia_dr3_shuffled_pan:
    dataset: gaia_dr3_shuffled
    q0:
      rect: "261:271,-32:-26"
      filters: {}
    minShift: 5
    maxShift: 12
    zoomFactor: 0
    seqCount: 100
    directionWeights:
      N: 1.0
      NE: 2.0
      E: 1.5
      SE: 0.8
      S: 0.5
      SW: 0.7
      W: 0.5
      NW: 0.8

  # Gaia DR3 10% test subset — for quick validation of NaN handling and correctness.
  # Same query pattern as gaia_dr3_pan but on the 10% modular sample (32.8M rows).
  gaia_dr3_test_pan:
    dataset: gaia_dr3_test
    q0:
      rect: "261:271,-32:-26"
      filters: {}
    minShift: 5
    maxShift: 12
    zoomFactor: 0
    seqCount: 100
    directionWeights:
      N: 1.0
      NE: 2.0
      E: 1.5
      SE: 0.8
      S: 0.5
      SW: 0.7
      W: 0.5
      NW: 0.8

  # Realistic exploration: analyst investigates taxi pickups in Manhattan.
  # Landscape viewport (0.12 x 0.06 deg, ~16:10 aspect at this latitude).
  # All pan phases are clamped to stay on Manhattan.
  # 100 queries total: q0 + 5 phases (5 + 3 + 60 + 3 + 28 = 99).
  taxi_zoom:
    dataset: taxi
    q0:
      rect: "-73.99:-73.94,40.745:40.77"
      filters: {}
    phases:
      # Phase 1: Orient -- user pans a few times to center on Manhattan
      - name: orient
        operation: pan
        count: 5
        minShift: 8
        maxShift: 15
        directionWeights: { N: 1, NE: 1, E: 1, SE: 1, S: 1, SW: 1, W: 1, NW: 1 }
        clampToBounds: "-74.05:-73.88,40.70:40.83"

      # Phase 2: Zoom into Times Square (cursor-anchored, 3 steps = 8x total)
      # Viewport: 0.12x0.06 -> 0.015x0.0075 (~1.3km x 0.8km, neighborhood level)
      - name: zoom_into_hotspot
        operation: zoom_to_point
        target: "-73.985,40.758"
        zoomFactor: 0.5
        count: 3

      # Phase 3: Investigate -- panning block by block, E-W zigzag with mild S drift.
      # Shifts of 10-20% at zoomed level = ~2-3 city blocks per step.
      - name: investigate
        operation: pan
        count: 60
        minShift: 10
        maxShift: 20
        directionWeights: { N: 0.5, NE: 0.5, E: 3, SE: 1, S: 2, SW: 1, W: 3, NW: 0.5 }
        clampToBounds: "-74.005:-73.965,40.735:40.77"

      # Phase 4: Zoom back out to overview (center-anchored, 3 steps = 8x total)
      - name: zoom_out
        operation: zoom_out
        zoomFactor: 2.0
        count: 3

      # Phase 5: Re-overview -- compare with Phase 1, index is now warm
      - name: re_overview
        operation: pan
        count: 28
        minShift: 8
        maxShift: 15
        directionWeights: { N: 1, NE: 1, E: 1, SE: 1, S: 1, SW: 1, W: 1, NW: 1 }
        clampToBounds: "-74.05:-73.88,40.70:40.83"