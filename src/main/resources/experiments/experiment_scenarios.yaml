  # Gaia DR3 spatial benchmark (10% sample, 328M rows, 14 columns).

  # Scenario: astronomer surveys the Galactic plane starting from the GC (RA≈266°, Dec≈-29°),
  # scanning outward (NE in equatorial coords) to study stellar populations and dust structure.
  # Viewport: 10° x 6° (~0.093% of full-sky area, ~4-5M stars per query).
  # Directional bias ~3:1 (NE along plane vs W/S opposite).
  gaia_dr3_pan:
    dataset: gaia_dr3
    q0:
      rect: "261:271,-32:-26"
    minShift: 5
    maxShift: 12
    zoomFactor: 0
    seqCount: 100
    directionWeights:
      N: 1.0
      NE: 2.0
      E: 1.5
      SE: 0.8
      S: 0.5
      SW: 0.7
      W: 0.5
      NW: 0.8
  # Realistic exploration: analyst investigates taxi pickups in Manhattan.
  # Landscape viewport (0.12 x 0.06 deg, ~16:10 aspect at this latitude).
  # All pan phases are clamped to stay on Manhattan.
  # 100 queries total: q0 + 5 phases (5 + 3 + 60 + 3 + 28 = 99).
  taxi_zoom:
    dataset: taxi
    q0:
      rect: "-73.99:-73.94,40.745:40.77"
    phases:
      # Phase 1: Orient -- user pans a few times to center on Manhattan
      - name: orient
        operation: pan
        count: 5
        minShift: 8
        maxShift: 15
        directionWeights: { N: 1, NE: 1, E: 1, SE: 1, S: 1, SW: 1, W: 1, NW: 1 }
        clampToBounds: "-74.05:-73.88,40.70:40.83"

      # Phase 2: Zoom into Times Square (cursor-anchored, 3 steps = 8x total)
      # Viewport: 0.12x0.06 -> 0.015x0.0075 (~1.3km x 0.8km, neighborhood level)
      - name: zoom_into_hotspot
        operation: zoom_to_point
        target: "-73.985,40.758"
        zoomFactor: 0.5
        count: 3

      # Phase 3: Investigate -- panning block by block, E-W zigzag with mild S drift.
      # Shifts of 10-20% at zoomed level = ~2-3 city blocks per step.
      - name: investigate
        operation: pan
        count: 60
        minShift: 10
        maxShift: 20
        directionWeights: { N: 0.5, NE: 0.5, E: 3, SE: 1, S: 2, SW: 1, W: 3, NW: 0.5 }
        clampToBounds: "-74.005:-73.965,40.735:40.77"

      # Phase 4: Zoom back out to overview (center-anchored, 3 steps = 8x total)
      - name: zoom_out
        operation: zoom_out
        zoomFactor: 2.0
        count: 3

      # Phase 5: Re-overview -- compare with Phase 1, index is now warm
      - name: re_overview
        operation: pan
        count: 28
        minShift: 8
        maxShift: 15
        directionWeights: { N: 1, NE: 1, E: 1, SE: 1, S: 1, SW: 1, W: 1, NW: 1 }
        clampToBounds: "-74.05:-73.88,40.70:40.83"

  # eBird US (2023-2026): ornithologist following spring migration from the
  # Rio Grande Valley to the Mid-Atlantic.
  # Start: South Texas coast / RGV (-98.5 to -95.5, 26 to 28) — the #1
  #   birding destination in the US during spring, where neotropical migrants
  #   first make landfall after crossing the Gulf of Mexico.
  # Path: NE through the Central/Mississippi Flyway — Great Plains, Ozarks,
  #   Ohio Valley, curving toward the Mid-Atlantic coast.
  # Viewport: 3° × 2° (~300 km × 222 km) — continental-scale patterns.
  # Shift 10-18%: slightly larger steps to cover more ground in 100 queries,
  #   expected total displacement ~20° E, ~12° N → endpoint near Chesapeake.
  # Selectivity: ~2-3% at start (RGV), rising to ~5-6% in the dense NE.
  ebird_us_pan:
    dataset: ebird_us
    q0:
      rect: "-98.5:-95.5,26:28"
    minShift: 10
    maxShift: 18
    zoomFactor: 0
    seqCount: 100
    directionWeights:
      N: 1.5
      NE: 3.0
      E: 2.0
      SE: 0.3
      S: 0.2
      SW: 0.1
      W: 0.2
      NW: 0.3

  # ── Non-exploration workloads (random) ─────────────────────────────────────
  # --- Uniform random ------------------------------------
  # Centres are sampled from a per-dataset spatial reservoir (single seeded
  # CSV pass, cached under experiments/query_sequences/reservoirs/), so the
  # query distribution follows the data distribution. The fixed (sx, sy) is
  # calibrated so that the AVERAGE per-query selectivity equals `selectivity`.
  # Per-query selectivity varies with local data
  # density on real datasets; on the uniform synthetic dataset the closedForm
  # mode collapses to plain uniform-domain queries with constant selectivity.
  # Boundary policy: rectangles that overflow the bounding box are shifted
  # inward (area preserved → mean selectivity preserved exactly).
  gaia_dr3_random:
    dataset: gaia_dr3
    workload:
      type: random
      seqCount: 300
      selectivity: 0.01
      seed: 0

  ebird_us_random:
    dataset: ebird_us
    workload:
      type: random
      seqCount: 300
      selectivity: 0.01
      seed: 0

  taxi_random:
    dataset: taxi
    workload:
      type: random
      seqCount: 300
      selectivity: 0.01
      seed: 0

  synth10_300M_random_sel1:
    dataset: synth10_300M
    workload:
      type: random
      seqCount: 300
      selectivity: 0.01
      extentMode: closedForm   # synthetic data is uniform: skip the reservoir build
      seed: 0
